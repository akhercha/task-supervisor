[package]
name = "task-supervisor"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
categories = ["asynchronous"]
description = "Supervisor for long-lived tokio tasks: restarts with backoff, graceful shutdown, runtime control"
authors = ["akhercha <adel@pragma.build>"]
keywords = ["tasks", "tokio", "supervisor"]
repository = "https://github.com/akhercha/task-supervisor"
license = "MIT"

[dependencies]
tokio = { version = "1.21", features = ["rt", "sync", "macros", "time"] }
tokio-util = "0.7.12"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "signal"] }
anyhow = "1"
tracing-subscriber = "0.3"
