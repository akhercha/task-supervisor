# Generated by the review-loop skill. Edit freely.
gates:
  lint: make lint
  test: make test
  baseline: null   # 0.5.0 rewrote the public API; the pre-change suite cannot compile against it

critical_paths:
  - src/supervisor.rs   # state machine, timers, JoinSet exit handling, shutdown drain
  - src/handle.rs       # last-drop shutdown, wait/outcome relay

gate_files:
  - .github/workflows/**
  - Makefile
  - tests/**

invariants:
  - "At most one run of a task is alive at any time."
  - "A Dead or Completed task is never started without an explicit restart_task."
  - "A stale backoff timer never starts a run."
  - "shutdown() and kill_task() return within shutdown_timeout of the request."
  - "Dropping a handle clone while another clone exists never stops the supervisor."
  - "A panic inside run is reported as a failure, never lost."

extinct: []
